plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.applemusickit.AppleMusicKitModule'
version = '0.1.0'

android {
  namespace "expo.modules.applemusickit.AppleMusicKitModule"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lint {
    abortOnError true
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.aar'])
  // Same OkHttp React Native ships, so the app does not carry two copies.
  // The client is shared across Apple Music reads; see AppleMusicKitModule.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
